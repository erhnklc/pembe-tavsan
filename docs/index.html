<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ff8fc0">
  <title>Pembe Tavşan</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-floaters" aria-hidden="true"></div>

  <header class="topbar">
    <button id="backBtn" class="round-btn" aria-label="Geri" hidden>⬅️</button>
    <h1 id="title">Pembe Tavşan</h1>
    <div class="stars" aria-label="Yıldızlar"><span class="kawaii sm" id="starIcon"></span><span id="starCount">0</span></div>
  </header>

  <main>
    <!-- Ana ekran -->
    <section id="home" class="screen">
      <div class="mascot" id="mascot">🐰🎀</div>
      <button id="startBtn" class="big-btn">Merhaba de! 👋</button>
      <div class="topic-grid" id="topicGrid"></div>
      <button id="parentLink" class="parent-link" aria-label="Ebeveyn ekranı (basılı tut)">👪 Ebeveyn · basılı tut</button>
    </section>

    <!-- Konu ekranı -->
    <section id="topic" class="screen" hidden>
      <div class="topic-emoji" id="topicEmoji"></div>
      <button class="big-btn" id="learnBtn">📖 Öğren</button>
      <button class="big-btn alt" id="playBtn">🎮 Oyun: Dinle ve Dokun</button>
    </section>

    <!-- Öğren -->
    <section id="learn" class="screen" hidden>
      <div class="stage">
        <div class="card-wrap">
          <button class="round-btn nav" id="prevCard" aria-label="Önceki">◀️</button>
          <button class="word-card" id="wordCard" aria-label="Kelimeyi dinle">
            <div class="visual" id="learnVisual"></div>
            <div class="en" id="learnEn"></div>
            <div class="tr" id="learnTr"></div>
            <div class="hint">🔊 Dokun ve dinle</div>
          </button>
          <button class="round-btn nav" id="nextCard" aria-label="Sonraki">▶️</button>
        </div>
        <div class="dots" id="dots"></div>
        <button class="flag-btn" id="flagLearn" aria-label="Sesi bildir">🚩 Ses bozuk</button>
      </div>
      <div class="listen-dock">
        <button class="big-btn listen" id="repeatLearn">🔊 Tekrar dinle</button>
      </div>
    </section>

    <!-- Oyun -->
    <section id="game" class="screen" hidden>
      <div class="stage">
        <div class="progress" id="progress"></div>
        <div class="prompt-word" id="promptWord"></div>
        <div class="choices" id="choices"></div>
        <button class="flag-btn" id="flagGame" aria-label="Sesi bildir">🚩 Ses bozuk</button>
      </div>
      <div class="listen-dock">
        <button class="big-btn listen" id="listenBtn">🔊 Tekrar dinle</button>
      </div>
    </section>

    <!-- Ebeveyn: ses kontrolü ve bildirimler -->
    <section id="parent" class="screen top" hidden>
      <h2>Ses kontrolü</h2>
      <p class="note">Dinle, bozuk olanı 🚩 ile işaretle. Aşağıdaki listeden GitHub'a gönderebilirsin.</p>
      <ul class="clip-list" id="clipList"></ul>
      <h2>Bildirimler (<span id="reportCount">0</span>)</h2>
      <ul class="clip-list" id="reportList"></ul>
      <div class="parent-actions">
        <button class="big-btn" id="sendReports">📨 GitHub'a gönder</button>
        <button class="big-btn alt" id="copyReports">📋 Kopyala</button>
        <button class="big-btn gray" id="clearReports">🗑️ Temizle</button>
      </div>
      <p class="note" id="parentMsg" role="status"></p>
    </section>

    <!-- Sonuç -->
    <section id="result" class="screen" hidden>
      <div class="mascot">🎉🐰🎉</div>
      <h2>Aferin sana!</h2>
      <div class="result-stars" id="resultStars"></div>
      <button class="big-btn" id="againBtn">🔁 Tekrar oyna</button>
      <button class="big-btn alt" id="homeBtn">🏠 Ana ekran</button>
    </section>
  </main>

  <div id="fx" aria-hidden="true"></div>
  <script src="app.js"></script>
</body>
</html>
